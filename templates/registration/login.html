<!DOCTYPE html>
<html lang="en">

<head>
    <title>Login | Food Waste Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }
        
        .login-box {
            width: 420px;
            background: white;
            border-radius: 18px;
            padding: 40px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        }
        
        .login-title {
            text-align: center;
            margin-bottom: 25px;
            font-weight: bold;
            color: #198754;
        }
        
        label {
            font-weight: 600;
            margin-bottom: 8px;
        }
        
        input {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #ccc;
            margin-bottom: 18px;
        }
        
        input:focus {
            border-color: #198754;
            outline: none;
            box-shadow: 0 0 8px rgba(25, 135, 84, 0.25);
        }
        
        .btn-login {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border-radius: 10px;
        }
        
        .register-link {
            text-align: center;
            margin-top: 18px;
        }
        
        .error-msg {
            color: red;
            text-align: center;
            margin-bottom: 15px;
            font-weight: 500;
        }
        
        .icon {
            font-size: 45px;
            text-align: center;
            display: block;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <div class="icon">🍱</div>

        <h2 class="login-title">Food Waste Login</h2>

        {% if form.errors %}
        <div class="error-msg">
            Invalid Username or Password
        </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <label>Username</label> {{ form.username }}

            <label>Password</label> {{ form.password }}

            <button type="submit" class="btn btn-success btn-login">
                Login
            </button>
        </form>

        <div class="register-link">
            Don't have an account?
            <a href="/register/">Register Here</a>
        </div>

    </div>

</body>

</html>
