<!DOCTYPE html>
<html>

<head>
    <title>Manage Requests</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5">

        <h2 class="mb-4">Manage Food Requests</h2>

        {% for req in requests %}
        <div class="card p-3 mb-3 shadow-sm">

            <h4>{{ req.food_post.food_name }}</h4>

            <p>
                <b>Volunteer:</b> {{ req.volunteer.username }} <br>
                <b>Location:</b> {{ req.food_post.location }} <br>
                <b>Status:</b> {{ req.status }}
            </p>

            {% if req.status == "Requested" %}
            <a href="/accept-request/{{ req.id }}/" class="btn btn-success">
               Accept
            </a>

            <a href="/reject-request/{{ req.id }}/" class="btn btn-danger">
               Reject
            </a> {% endif %}

        </div>
        {% empty %}
        <p>No requests yet.</p>
        {% endfor %}

        <a href="/" class="btn btn-secondary">
        Back
    </a>

    </div>

</body>

</html>
