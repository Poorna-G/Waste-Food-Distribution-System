<!DOCTYPE html>
<html lang="en">

<head>
    <title>Add Food Donation</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: white;
        }
        
        .food-box {
            max-width: 700px;
            margin: 50px auto;
            padding: 40px;
            border-radius: 20px;
            background: white;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.12);
        }
        
        h2 {
            color: #198754;
            font-weight: 700;
            text-align: center;
            margin-bottom: 10px;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }
        
        label {
            font-weight: 600;
            margin-bottom: 8px;
            display: block;
        }
        
        input,
        textarea,
        select {
            width: 100%;
            height: 50px;
            border-radius: 12px !important;
            border: 1px solid #ddd !important;
            padding: 12px 15px !important;
            font-size: 15px;
            margin-bottom: 20px;
        }
        
        textarea {
            min-height: 120px;
            resize: none;
        }
        
        input:focus,
        textarea:focus,
        select:focus {
            border-color: #198754 !important;
            box-shadow: 0 0 8px rgba(25, 135, 84, .2) !important;
        }
        
        .btn-custom {
            width: 100%;
            height: 50px;
            border-radius: 12px;
            font-weight: 600;
        }
        
        .top-link {
            text-decoration: none;
            color: #198754;
            font-weight: 600;
        }
        
        .icon {
            text-align: center;
            font-size: 45px;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="food-box">

            <a href="/" class="top-link">← Back</a>

            <div class="icon">🍱</div>

            <h2>Add Food Donation</h2>
            <p class="subtitle">Fill details properly for food pickup</p>

            <form method="POST">
                {% csrf_token %}

                <label>Food Name</label> {{ form.food_name }}

                <label>Quantity</label> {{ form.quantity }}

                <label>Location</label> {{ form.location }}

                <label>Expiry Date & Time</label>
                <input type="datetime-local" name="expiry_time" required>

                <label>Description</label> {{ form.description }}

                <div class="row mt-3">
                    <div class="col-md-6">
                        <button type="submit" class="btn btn-success btn-custom">
                        Submit Food
                    </button>
                    </div>

                    <div class="col-md-6">
                        <a href="/" class="btn btn-secondary btn-custom">
                        Cancel
                    </a>
                    </div>
                </div>

            </form>

        </div>

    </div>

</body>

</html>
