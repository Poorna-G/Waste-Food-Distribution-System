<!DOCTYPE html>
<html lang="en">

<head>
    <title>Register | Food Waste Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }
        
        .register-box {
            width: 500px;
            background: white;
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
        }
        
        .register-title {
            text-align: center;
            color: #0d6efd;
            font-weight: bold;
            margin-bottom: 20px;
        }
        
        .icon {
            text-align: center;
            font-size: 45px;
            margin-bottom: 10px;
        }
        
        label {
            font-weight: 600;
            margin-bottom: 6px;
        }
        
        input,
        select {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #ccc;
            margin-bottom: 15px;
        }
        
        input:focus,
        select:focus {
            border-color: #0d6efd;
            outline: none;
            box-shadow: 0 0 8px rgba(13, 110, 253, 0.25);
        }
        
        .helptext {
            font-size: 13px;
            color: #666;
            margin-bottom: 15px;
            display: block;
        }
        
        ul {
            font-size: 13px;
            color: #666;
            padding-left: 18px;
        }
        
        .btn-register {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            font-size: 16px;
        }
        
        .login-link {
            text-align: center;
            margin-top: 15px;
        }
        
        .errorlist {
            color: red;
            font-size: 14px;
            list-style: none;
            padding: 0;
        }
    </style>
</head>

<body>

    <div class="register-box">

        <div class="icon">🍱</div>

        <h2 class="register-title">Create Account</h2>

        <form method="POST">
            {% csrf_token %} {{ form.username.label_tag }} {{ form.username }} {{ form.password1.label_tag }} {{ form.password1 }} {{ form.password1.help_text }} {{ form.password2.label_tag }} {{ form.password2 }}

            <label>Select Role</label>
            <select name="role">
            <option value="donor">Donor</option>
            <option value="volunteer">Volunteer</option>
        </select>

            <button class="btn btn-primary btn-register">
            Register
        </button>
        </form>

        <div class="login-link">
            Already have account?
            <a href="/accounts/login/">Login Here</a>
        </div>

    </div>

</body>

</html>
